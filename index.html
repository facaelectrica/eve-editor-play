<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Eve Flow Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: three-pane tool. Navigator | yEd-faithful canvas (always light "paper") | inspector.
   Deliberately single light theme close to yEd's own chrome, system fonts: works offline, no external files. */
:root {
	--bg: #eceef1; --panel: #f7f8fa; --panel-2: #ffffff; --fg: #1f2328; --muted: #5f6672; --line: #d4d8de;
	--accent: #2f6fd6; --accent-soft: #e3ecfb; --bad: #c62828; --bad-soft: #fdecec; --warn: #9a5a00; --warn-soft: #fff2db; --ok: #2e7d32;
	--paper: #ffffff; --grid: #ececec;
	--ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
	color-scheme: light;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 13px; }
.app { height: 100%; display: grid; grid-template-columns: var(--navw, 260px) 1fr var(--sidew, 300px); grid-template-rows: auto auto 1fr; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
header h1 .ver { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.spacer { flex: 1; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

nav { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 2px; align-self: stretch; margin: -8px 0; }
.tabs button { font: inherit; font-size: 14px; font-weight: 500; padding: 0 14px; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--fg); }
.tabs #tabScene { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tabs .tgrp { align-self: center; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 4px 0 10px; }
.tabs .tgrp ~ .tgrp { margin-left: 10px; border-left: 1px solid var(--line); padding-left: 14px; }
.crumbbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 6px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--bg); min-height: 22px; font-size: 13px; }
.app > nav { grid-column: 1; grid-row: 3; } .app > main { grid-column: 2; grid-row: 3; } .app > aside { grid-column: 3; grid-row: 3; }
.app.noside { grid-template-columns: 0 1fr var(--sidew, 300px); }
.colgrip { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 30; }
.colgrip:hover, .colgrip.on { background: rgba(47,95,208,.25); }
#gripL { left: 0; } #gripR { right: 0; }
aside.split { padding: 0; gap: 0; overflow: hidden; }
.sp-top, .sp-bot { overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 60px; }
.sp-top { flex: none; } .sp-bot { flex: 1; }
.sp-bar { flex: none; height: 7px; cursor: row-resize; background: var(--line); border-top: 1px solid var(--panel); border-bottom: 1px solid var(--panel); }
.sp-bar:hover, .sp-bar.on { background: rgba(47,95,208,.35); }
.app.noside nav { display: none; }
.elist { display: flex; flex-direction: column; padding: 4px 16px 40px; overflow: auto; }
.elist .erow { display: grid; grid-template-columns: var(--cw, 300px) 220px 1fr; gap: 16px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.elist.nodoc .erow { grid-template-columns: var(--cw, 300px) 1fr; }
.elist .ci { display: flex; flex-direction: column; justify-content: center; background: var(--fill); border: 1px solid #000; padding: 4px 8px; box-sizing: border-box; text-align: center; line-height: 1.35; }
.elist .erow:hover { background: var(--panel-2); }
.elist .erow.sel { background: var(--panel-2); outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.elist .erow.bad .enm { color: var(--bad); }
.elist .enm { font-weight: 600; font-size: 13px; word-break: break-word; }
.elist .edoc { user-select: text; font-size: 12px; color: var(--muted); white-space: pre-wrap; min-height: 1.4em; cursor: text; border-radius: 4px; padding: 2px 4px; }
.elist .edoc:focus { outline: 1px solid var(--accent); color: inherit; background: #fff; }
.sflow { overflow: auto; display: block; padding: 12px 16px 40px; user-select: none; }
.sflow input, .sflow textarea { user-select: text; }
.sflow .crow { display: flex; gap: 12px; align-items: flex-start; width: max-content; }
.sflow .cpart { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 240px; }
.sflow .cpart.bd { width: 440px; }
.sflow .cpart.empty { opacity: .75; }
.sflow .cpt, .sflow .cph { display: flex; align-items: center; gap: 6px; font-weight: 600; border-radius: 5px; }
.sflow .cpt { padding: 4px 8px; background: #99cc00; margin-bottom: 8px; }
.sflow .cph { font-size: 13px; padding: 3px 8px; background: #e6dcf5; }
.sflow .cpt > span, .sflow .cph > span { flex: none; margin-right: 4px; }
.sflow .cphases { display: flex; gap: 10px; align-items: flex-start; }
.sflow .cphase { flex: none; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
.sflow .cseq { display: flex; flex-direction: column; gap: 0; }
.sflow .cseq > .ci + .ci { margin-top: -1px; }
.sflow .ci.dragging { opacity: .4; }
.sflow .ci.dropto { box-shadow: 0 0 0 3px var(--accent) inset; }
.sflow .ci[draggable=true] { cursor: grab; }
.sflow .ci { display: flex; flex-direction: column; justify-content: center; background: var(--fill); border: 1px solid #000; padding: 4px 8px; box-sizing: border-box; cursor: pointer; text-align: center; line-height: 1.35; }
.sflow .ci .ct { font-size: 10px; color: rgba(0,0,0,.55); }
.sflow .ci .cs { font-size: 10px; font-weight: 600; border-left: 6px solid var(--rc); padding-left: 4px; color: var(--muted); }
.sflow .ci .cl { white-space: pre-wrap; }
.sflow .ci.sel, .sflow .cbv.sel, .sflow .chead.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.sflow .off { opacity: .55; }
.sflow .chead { display: flex; width: max-content; min-width: 240px; flex-direction: column; gap: 1px; margin-bottom: 12px; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.sflow .chead .ct { font-size: 10px; color: var(--muted); }
.sflow .chead .chn { font-size: 15px; font-weight: 600; }
.sflow .chead.cref { margin-top: 28px; }
.sflow .crow + .chead.cref { box-shadow: 0 -15px 0 -14px var(--line); }
.sflow { cursor: grab; }
body.panning, body.panning * { cursor: grabbing !important; user-select: none; }
.sflow .cex { border: 0; background: none; color: #444; font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 6px; flex: none; border-radius: 4px; }
.sflow .cex:hover { color: #fff; background: var(--bad); }
.sflow .bad, .sflow .ci.sel.bad { outline: 2px solid var(--bad); outline-offset: 1px; }
.sflow .csplit { display: flex; flex-direction: column; gap: 4px; width: max-content; }
.sflow .csplit > .ci.csh { width: auto !important; align-self: stretch; }
.sflow .cpt.pick, .sflow .cph.pick { cursor: pointer; }
.sflow .cpt.sel, .sflow .cph.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.sflow .cbranches { display: flex; gap: 6px; align-items: flex-start; }
.sflow .cbranch { flex: none; min-width: 200px; display: flex; flex-direction: column; gap: 4px; padding: 4px; border: 1px solid var(--line); border-top: 3px solid var(--rc, #a7b8ea); border-radius: 6px; background: rgba(255,255,255,.55); }
.sflow .cbh { display: flex; flex-direction: column; gap: 3px; position: relative; }
.sflow .cbh > .cex { position: absolute; right: 0; top: 0; }
.sflow .cbv { font: inherit; font-size: 11px; font-weight: 600; align-self: flex-start; padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); cursor: pointer; }
.sflow .cbdform select, .sflow .cbdform input { max-width: 100%; }
.sflow .cstage { min-height: 100%; display: flex; align-items: center; justify-content: center; }
.sflow .cstage .ci { cursor: default; }
.sflow .cslot, .sflow .cshared { font: inherit; font-size: 11px; color: var(--accent); background: none; border: 1px dashed var(--accent); border-radius: 4px; padding: 2px 8px; cursor: pointer; align-self: flex-start; }
/* Every + in a scene is the same button: where it stands is where the new card goes. */
.sflow .cadd, .sflow .cpl { flex: none; width: 22px; height: 22px; padding: 0; font: inherit; font-size: 15px; line-height: 1; color: var(--accent); background: #fff; border: 1px solid var(--accent); border-radius: 5px; cursor: pointer; align-self: flex-start; }
.sflow .cadd:hover, .sflow .cpl:hover { background: var(--accent); color: #fff; }
.sflow .cseq > .cadd { margin-top: 4px; }
.bswitch { display: flex; gap: 4px; }
.item .pmiss { margin-left: auto; font-size: 10px; color: var(--muted); padding-left: 6px; }
.sflow .cslot { color: var(--accent); }
/* v39 adding model: a + between cards shows on hover; values are picked on the card and the branch itself. */
.sflow .cgap { position: relative; height: 0; z-index: 2; }
.sflow .cgap .cgp { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1px solid var(--accent); background: #fff; color: var(--accent); font: inherit; font-size: 13px; line-height: 15px; cursor: pointer; opacity: 0; transition: opacity .1s; }
.sflow .cgap:hover .cgp, .sflow .cgap .cgp:focus-visible, .sflow .cseq:hover > .cgap .cgp { opacity: .35; }
.sflow .cgap .cgp:hover { opacity: 1; background: var(--accent); color: #fff; }
.sflow .ci.editing { cursor: default; }
.sflow .ci .cedit { width: 100%; box-sizing: border-box; font: inherit; text-align: center; text-align-last: center; color: inherit; background: rgba(255,255,255,.65); border: 1px solid rgba(0,0,0,.25); border-radius: 3px; padding: 2px 4px; resize: none; overflow: hidden; }
.sflow .ci .cedit.bad, .sflow select.cbv.bad, .sflow input.cbv.bad { outline: 2px solid var(--bad); outline-offset: 0; }
.sflow select.cbv, .sflow input.cbv { font: inherit; font-size: 11px; font-weight: 600; align-self: flex-start; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); cursor: pointer; max-width: 100%; }
.sflow .cbv.cghost { cursor: default; color: var(--muted); font-weight: 500; }
.sflow .cbranch.empty { border-style: dashed; background: transparent; min-width: 140px; }
.sflow .crow-add { align-self: center; }
.sflow .cshared { border-style: solid; color: var(--muted); margin: 0 0 6px; }
.board { position: absolute; inset: 0; z-index: 6; background: var(--bg); display: flex; flex-direction: column; cursor: default; user-select: none; }
.board.panning, .board.panning * { cursor: grabbing !important; }
.board .bhead { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.board .bhead input[type=search] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 240px; background: var(--bg); color: var(--fg); }
.board .cols { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px 14px; overflow-x: auto; align-items: stretch; }
.board .col { flex: none; width: 240px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.board .col h3 { margin: 0; font-size: 13px; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
.board .col h3 .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.board .col .list { flex: 1; padding: 4px 0 8px; }
.cycstat { font-size: 12px; padding: 3px 9px; border-radius: 999px; }
.cycstat.ok { background: rgba(34,160,90,.12); color: #15803d; }
.cycstat.warn { background: rgba(217,119,6,.14); color: #b45309; }
.cyc { flex: 1; min-height: 0; overflow: auto; padding: 8px 18px 40px; }
.cyc-g { margin-top: 18px; }
.cyc-g:first-child { margin-top: 4px; }
.cyc-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 0 4px 34px; }
.cyc-h .dot { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.cyc-r { display: grid; grid-template-columns: 26px minmax(180px, 280px) minmax(0, 1fr); gap: 0 10px; align-items: start; padding: 2px 0; border-radius: 6px; outline: none; }
.cyc-r:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.cyc-r.dragging { opacity: .4; }
.cyc-r.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.cyc-r.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.cyc-r .pos { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; padding-top: 7px; }
.cyc-b { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 10px; border: 1px solid rgba(0,0,0,.25); border-radius: 6px; color: #1a1a1a; font-weight: 600; font-size: 13px; cursor: grab; user-select: none; }
.cyc-b > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cyc-n { font-size: 12.5px; line-height: 1.45; color: var(--fg); padding: 5px 8px; border-radius: 6px; cursor: text; min-height: 30px; }
.cyc-n:hover { background: var(--accent-soft); }
.cyc-n.empty { color: transparent; }
.cyc-r.sel { background: var(--accent-soft); }
.cyc-r.sel .cyc-b { box-shadow: 0 0 0 2px var(--accent); }
.cyc-d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.cyc-r:hover .cyc-n.empty { color: var(--muted); }
.cyc-nt p { margin: 0 0 4px; }
.cyc-nt p:last-child { margin: 0; }
.cyc-nt .tag { font-size: 10px; letter-spacing: .05em; padding: 1px 5px; margin-right: 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.cyc-n textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--fg); resize: vertical; }
.cyc-rest { margin: 28px 0 0 34px; }
.cyc-rest .cyc-h { padding-left: 0; }
.cyc-rest .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.search { padding: 8px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.list { overflow: auto; flex: 1; padding: 4px 0 16px; }
.group-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px 4px; }
/* Heading levels, one treatment each, used by every list and board. Items are plain 13px text with a dot.
   hl0 list section (EVENTS, GROUPS) · hl1 category (JOB) · hl2 grouping word (CAREER) · hl3 named group (Influencer) · hl4 phase (Start / End). */
.group-h.hl0 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--line); padding-top: 12px; padding-bottom: 4px; }
.group-h.hl1 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--fg); padding-top: 6px; }
.group-h.hl2 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); padding-top: 4px; }
.group-h.hl3 { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--fg); padding-top: 4px; }
.group-h.hl4 { font-size: 11px; font-weight: 500; font-style: italic; text-transform: none; letter-spacing: 0; color: var(--muted); padding-top: 2px; }
.group-h.hl3 .nm { border-bottom: 1px dotted var(--line); }
.item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; font: inherit; border: 0; background: none; color: var(--fg); padding: 4px 12px; cursor: pointer; }
.item:hover { background: var(--accent-soft); }
.item[aria-current="true"] { background: var(--accent-soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); color: var(--accent); }
.item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; border: 1px solid rgba(0,0,0,.25); }
.item .caret { width: 12px; flex: none; color: var(--muted); text-align: center; font-size: 10px; }
.item .caret.has { cursor: pointer; }
.item .caret.has:hover { color: var(--fg); }
.item .pos { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 18px; flex: none; text-align: right; }
.item.gap { margin-top: 9px; }
.item[draggable="true"] { cursor: grab; }
.item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.item.dragging { opacity: .4; }
/* Shared list head (v37): every collection has Filter and + at its top; + opens the new item's form in Properties. */
.lhead, .board .bhead { display: flex; gap: 8px; align-items: center; }
.lhead { padding: 8px; border-bottom: 1px solid var(--line); flex: none; }
.lhead input[type=search] { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.ladd { flex: none; width: 30px; height: 30px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--accent); font: inherit; font-size: 18px; line-height: 1; cursor: pointer; padding: 0; }
.ladd:hover, .ladd[aria-pressed=true] { background: var(--accent); color: #fff; }
#addSlot:empty { display: none; }
.field input.bad, .field select.bad { border-color: var(--bad); background: var(--bad-soft); }
.dock { border-top: 1px solid var(--line); flex: none; max-height: 55%; overflow: auto; }
.dsec { border-bottom: 1px solid var(--line); }
.dsec > summary { cursor: pointer; padding: 8px 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); list-style: none; }
.dsec > summary::before { content: "▸ "; } .dsec[open] > summary::before { content: "▾ "; }
.dsec > summary b { font-weight: 600; color: var(--fg); text-transform: none; letter-spacing: 0; margin-left: 4px; }
.dsec .catbar { border-bottom: 0; }
nav > .catbar { flex-wrap: nowrap; overflow-x: auto; flex: none; scrollbar-width: none; } nav > .catbar .chip { flex: none; }
.cform { display: grid; grid-template-columns: 70px 1fr; gap: 6px 8px; align-items: center; padding: 4px 12px 12px; font-size: 12px; }
.cform input[type=text], .cform select { width: 100%; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg, #fff); color: var(--fg); }
.cform .full { grid-column: 1 / -1; }
.catbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); align-items: center; }
.chip { font: inherit; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip .n { color: var(--muted); font-family: var(--mono); }
.sidecmt { background: #fff6cc; border: 1px solid #e6c200; border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: pre-wrap; }
.catrow { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 6px; align-items: center; }
.catrow input[type=color] { width: 34px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.catrow input[type=text] { font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
.savebtn { font: inherit; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
.savebtn:disabled { opacity: .5; cursor: default; }

// ---------- Shared interaction rules: one behaviour for every view (EDITOR_SPEC "Shared UI rules") ----------
// Pan: a left-button drag scrolls whatever scrollable area is under the pointer, horizontally and vertically, in every tab
// (lists, boards, scene columns, WORLD lists, forms, grids, the Properties panel). It never starts on a field you type in,
// on something you drag to reorder (draggable cards, main cycle rows) or on a column grip, and the flowchart canvas keeps
// its own pan. Moving less than 5 px is a click; a drag is never a click.
(() => {
	const NO_PAN = "input, textarea, select, option, [contenteditable=true], [contenteditable=plaintext-only], [draggable=true], .colgrip, .zoombar, .addmenu, #loading";

	let D = null;
	document.addEventListener("pointerdown", ev => {
		D = null;
		if (ev.button !== 0 || !(ev.target instanceof Element)) return;
		const t = ev.target;
		if (t.closest(NO_PAN) || t.closest(".cyc-r") && !t.closest(".cyc-n")) return; // a main cycle row drags to reorder; its notes side pans
		// The flowchart canvas pans itself; boards and scene columns drawn over it use this one.
		if (t.closest("#canvas") && !t.closest(".board")) return;

		if (D.moved) {

// ---------- Hooks into the editor: one Save, one unsaved count ----------
{
	const prevDirty = dirtyCount; dirtyCount = function () { return (S.data ? prevDirty() : 0) + (WD.changes ? 1 : 0); };
	const flowDirty = () => S.data ? prevDirty() : 0;
	const prevUpd = updateDirty;
	updateDirty = function () {

	};
	const prevSave = save;
	save = async function () {

		const needFlow = S.data && S.data.events.text && (flowDirty() || !(S.data.events.eve && S.data.scenes.eve));
		if (needFlow) await prevSave();

	$("revertBtn").addEventListener("click", ev => {

// ---------- Column groups ----------
// The editor's own presentation of each sheet: named, colored runs of columns, saved in the World file with the notes.
// A group is { name, color, from, to } with from/to header names; runs never overlap. These start the layout until a World file holds one.
const WORLD_LAYOUT_START = {
	agents: [{ name: "BIOLOGICAL", color: "#93C47D", from: "age", to: "activeSickness" }, { name: "Physical Attributes", color: "#A2C4C9", from: "EastPacific", to: "IndoLatino" }, { name: "Education Levels", color: "#93C47D", from: "passion", to: "educationLevel" }, { name: "RESIDENCE", color: "#6D9EEB", from: "residenceCity", to: "residenceID" }, { name: "INCOME", color: "#8E7CC3", from: "inheritedIncome", to: "inheritedIncome" }, { name: "EDUCATION", color: "#FFD966", from: "educationRole", to: "educationLocationDomain" }, { name: "JOB", color: "#FF9900", from: "jobRole", to: "jobLocationDomain" }, { name: "HOBBY", color: "#FFD966", from: "hobbyRole", to: "knowledgeCareer" }, { name: "RESOURCES", color: "#B4A7D6", from: "health", to: "stress" }, { name: "TRAITS", color: "#D5A6BD", from: "empathy", to: "sexualFulfillment" }],
	rels: [{ name: "", color: "#93C47D", from: "activeRelationship", to: "activeRelationship" }, { name: "", color: "#FFD966", from: "lineage", to: "isConceptionPartner" }, { name: "Select Friend", color: "#6FA8DC", from: "commonInterests", to: "sharedExperiences" }, { name: "Keep Friend", color: "#6D9EEB", from: "trust", to: "trust" }, { name: "Select Partner", color: "#B4A7D6", from: "attraction", to: "chemistry" }, { name: "Keep Partner", color: "#D5A6BD", from: "sexualConnection", to: "keepRelationship" }],
	roles: [{ name: "", color: "#F6B26B", from: "incomeLevel", to: "incomeLevel" }, { name: "External Influences", color: "#93C47D", from: "danger", to: "hazard" }],
	locations: [{ name: "", color: "#FFE599", from: "Memory", to: "Memory" }, { name: "", color: "#6AA84F", from: "locationCategory", to: "locationSubCategory" }, { name: "", color: "#9FC5E8", from: "city", to: "city" }, { name: "", color: "#B4A7D6", from: "crimeLevel", to: "minIncomeLevel" }, { name: "", color: "#FFE599", from: "startYear", to: "FriendResidenceFilter" }],
	domains: [{ name: "", color: "#6AA84F", from: "locationRoomType", to: "parentLocation" }, { name: "REFERENCE ONLY", color: "#9FC5E8", from: "city", to: "city" }, { name: "", color: "#E69138", from: "availableCareer", to: "availableCareer" }, { name: "", color: "#E06666", from: "roleAllowsInternationalHiring", to: "allowedGender" }, { name: "", color: "#6D9EEB", from: "knowledgeCareer", to: "knowledgeCareer" }]

const wLayoutStart = () => JSON.parse(JSON.stringify(WORLD_LAYOUT_START));
// The header color: the group color mixed with white, as the sheet's header row was lighter than its group row.
function wTint(hex) { const n = parseInt(hex.slice(1), 16), m = v => Math.round(v + (255 - v) * 0.55); return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`; }
// Each group with the header indexes it spans in a table, in column order; groups whose columns are gone are left out.
function wGroups(key) {
	const T = WD.tabs && WD.tabs[key], gs = (WD.layout && WD.layout[key]) || []; if (!T) return [];
	const ix = name => T.header.findIndex(h => h.trim() === name);
	return gs.map(g => ({ g, a: ix(g.from), b: ix(g.to) })).filter(x => x.a >= 0 && x.b >= x.a).sort((x, y) => x.a - y.a);
}
// Group of each column name in a table: { name, band, head, g }.
function wGroupOf(key) {
	const T = WD.tabs[key], m = new Map();
	for (const { g, a, b } of wGroups(key)) { const v = { name: g.name, band: g.color, head: wTint(g.color), g }; for (let i = a; i <= b; i++) { const n = T.header[i].trim(); if (n && !m.has(n)) m.set(n, v); } }
	return m;

// Edits one group, or makes one over the given columns: name, color and its first and last column, within the columns no other group holds.
function wGroupEdit(key, g, span, at) {
	const old = $("wGroupPop"); if (old) old.remove();
	const T = WD.tabs[key], names = T.header.map(h => h.trim()), list = (WD.layout[key] ||= []);
	const runs = wGroups(key).filter(x => x.g !== g), cur = g ? wGroups(key).find(x => x.g === g) : { a: span[0], b: span[1] };
	// The columns this group may grow into: up to the neighbouring groups.
	const lo = Math.max(-1, ...runs.filter(x => x.b < cur.a).map(x => x.b)) + 1, hiCands = runs.filter(x => x.a > cur.b).map(x => x.a), hi = (hiCands.length ? Math.min(...hiCands) : names.length) - 1;

		Object.assign(me, { name: name.value.trim(), color: color.value.toUpperCase(), from: names[a], to: names[b] });

	};
	if (g) { name.onchange = color.oninput = from.onchange = to.onchange = apply; }
	const row = (l, c) => el("label", { className: "wgp-r" }, el("span", { textContent: l }), c);
	pop.append(row("Name", name), row("Color", color), row("From", from), row("To", to));
	const btns = el("div", { className: "wgp-b" });
	if (g) btns.append(el("button", { className: "btn danger", textContent: "Delete", onclick: () => { list.splice(list.indexOf(g), 1); WD.changes++; updateDirty(); pop.remove(); wStage(); if (!WTK[key].gridOnly) wSide(); } }));

	pop.append(btns); document.body.append(pop);
	const r = pop.getBoundingClientRect(); if (r.right > innerWidth - 8) pop.style.left = innerWidth - 8 - r.width + "px";

	setTimeout(() => { document.addEventListener("pointerdown", close, true); document.addEventListener("keydown", close, true); });
	name.focus();
}
